{% extends 'base.html' %}{% block content %}
<main class="narrow panel">
  <h1>Ganti password awal</h1>
  <p>
    Untuk keamanan data warga, buat password baru minimal 10 karakter. Jangan gunakan tanggal lahir
    lagi.
  </p>
  <form method="post">
    <label>Password baru</label
    ><input type="password" name="password" minlength="10" required /><button>
      Simpan password →
    </button>
  </form>
</main>
{% endblock %}
